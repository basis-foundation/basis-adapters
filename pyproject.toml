[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "basis-adapters"
version = "0.1.0"
description = "Protocol adapters that normalize operations into BASIS authorization semantics"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[project.urls]
Repository = "https://github.com/basis-foundation/basis-adapters"
Issues = "https://github.com/basis-foundation/basis-adapters/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff==0.16.2",
    "mypy>=1.10",
    "jsonschema>=4.18",
]

[tool.hatch.build.targets.wheel]
packages = ["src/basis_adapters"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"
packages = ["basis_adapters"]
sqlite_cache = false
